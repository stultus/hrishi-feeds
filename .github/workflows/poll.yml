name: poll

on:
  schedule:
    # Hourly quick check: Goodreads exits after one small request when its
    # recent activity has nothing new. Off the top of the hour, when
    # GitHub's scheduler is busiest.
    - cron: "17 * * * *"
    # Daily full Goodreads sync, which also catches books that never showed
    # up in the 10-entry activity feed.
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push as the PAT user so downstream workflows (dispatch.yml) see the
          # commit. Pushes authenticated with the default GITHUB_TOKEN do not
          # trigger other workflows — that's a GitHub Actions safeguard.
          token: ${{ secrets.SITE_DEPLOY_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync

      # Each source runs even if the other fails, so one broken feed can't
      # hold back the other's commit. "Report failures" fails the job after.
      - name: Poll Letterboxd
        id: letterboxd
        continue-on-error: true
        env:
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
        run: uv run scripts/poll_letterboxd.py

      - name: Poll Goodreads
        id: goodreads
        continue-on-error: true
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * *' }}
        run: uv run scripts/poll_goodreads.py $([ "$FULL" = true ] && echo --full)

      - name: Commit changes
        run: |
          if git diff --quiet -- data/; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: feeds update"
          git push

      - name: Report failures
        if: steps.letterboxd.outcome == 'failure' || steps.goodreads.outcome == 'failure'
        run: |
          echo "letterboxd: ${{ steps.letterboxd.outcome }}, goodreads: ${{ steps.goodreads.outcome }}"
          exit 1
